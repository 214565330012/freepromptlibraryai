<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#6959cb"><title>Admin Panel | FreePromptLibraryAI"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"></head>
<body><main class="admin-shell"><header class="admin-top"><a href="../index.html" class="brand">FreePrompt<span>LibraryAI</span></a><span class="admin-pill">ADMIN PANEL</span></header>
<section class="login-card" id="loginView"><div class="eyebrow">SECURE SIGN IN</div><h1>Admin Login</h1><p>Sign in with the admin email and password you created in Supabase Authentication.</p><form id="loginForm"><label>Email<input type="email" id="loginEmail" autocomplete="username" required></label><label>Password<input type="password" id="loginPassword" autocomplete="current-password" required></label><button class="primary" type="submit">Sign in</button><p class="message" id="loginMessage" role="status"></p></form></section>
<section class="dashboard" id="dashboardView" hidden><div class="dash-heading"><div><div class="eyebrow">CONTENT MANAGEMENT</div><h1>Prompt Library</h1><p id="signedInAs"></p></div><button class="secondary" id="signOutBtn" type="button">Sign out</button></div>
<div class="stats-row"><div class="stat"><span>All prompts</span><strong id="totalCount">—</strong></div><div class="stat"><span>Published</span><strong id="publishedCount">—</strong></div><div class="stat"><span>Drafts</span><strong id="draftCount">—</strong></div></div>
<div class="toolbar"><h2>Manage prompts</h2><button class="primary" id="newPromptBtn" type="button">+ Add new prompt</button></div>
<div class="table-wrap"><table><thead><tr><th>Prompt</th><th>Type</th><th>Status</th><th>Trending</th><th>Actions</th></tr></thead><tbody id="promptRows"><tr><td colspan="5">Loading prompts…</td></tr></tbody></table></div>
<section class="editor-card" id="editorCard" hidden><div class="editor-heading"><div><div class="eyebrow">PROMPT EDITOR</div><h2 id="editorTitle">Add prompt</h2></div><button class="icon-button" id="closeEditorBtn" type="button" aria-label="Close editor">×</button></div>
<form id="promptForm"><input type="hidden" id="promptId"><div class="form-grid">
<label>Title (English)<input id="title" required maxlength="180"></label><label>Title (Hindi)<input id="titleHi" maxlength="180"></label>
<label>Type<select id="type"><option>Photo</option><option>Video</option></select></label><label>Category<input id="category" required maxlength="80" placeholder="e.g. Wedding, Portrait"></label>
<label class="span-2">Prompt (English)<textarea id="promptEn" rows="5" required></textarea></label><label class="span-2">Prompt (Hindi)<textarea id="promptHi" rows="5"></textarea></label>
<label>Aspect ratio<input id="aspectRatio" placeholder="e.g. 9:16"></label><label>Duration<input id="duration" placeholder="e.g. 10 seconds"></label>
<label class="span-2">Sample image (max 5 MB)<input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp,image/avif"><small id="currentImage"></small></label>
<label>Status<select id="status"><option value="draft">Draft</option><option value="published">Published</option></select></label><label class="check-label"><input id="isTrending" type="checkbox"> Show in Trending Prompts</label>
</div><div class="sections-heading"><div><h3>Extra detail sections</h3><p>Add headings, English/Hindi explanations and optional images to the prompt detail page.</p></div><button type="button" class="secondary" id="addSectionBtn">+ Add section</button></div><div id="extraSectionList" class="extra-section-list"></div>
<div class="form-actions"><span id="saveMessage" class="message" role="status"></span><button type="button" class="secondary" id="cancelBtn">Cancel</button><button type="submit" class="primary" id="saveBtn">Save prompt</button></div></form></section>
</section><footer class="admin-footer"><span>FreePromptLibraryAI · Private content manager</span><a href="../index.html">View website</a></footer></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="admin.js"></script></body></html>
